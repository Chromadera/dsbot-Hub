name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tests
        run: npm test
      - name: Release metadata
        run: node scripts/check-release.mjs
      - name: Secret scan (tree and history)
        run: node scripts/check-secrets.mjs --history
      - name: Require repository metadata
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.repository?.url) {
              console.error('package.json: repository.url is required for npm publish --provenance');
              process.exit(1);
            }
          "
      # The GitHub release archive is built on a machine that holds the fork
      # tarball (see RELEASING.md) and attached to the release by hand. This
      # workflow publishes the npm package, which does not contain the fork.
      # Authenticates through OIDC against the package's trusted publisher
      # (Chromadera/dsbot-Hub, release.yaml). No long-lived npm token.
      - name: Publish hub
        run: npm publish --provenance --access public
